[package]
name = "oqs-quant-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Open Quant Studio deterministic formal backtest engine"

[lib]
name = "oqs_quant_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.28.3", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
